# CI/CD for CIDMS.
#   Every push and pull request: lint, the server tests (against a real Postgres), the screens' type-check and build.
#   A push to main that passes: deploys to the Oracle server (same steps as deploy/deploy.ps1, without moving data).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST      the server's IP, e.g. 137.23.42.178
#   DEPLOY_USER      opc
#   DEPLOY_SSH_KEY   the whole private key file (the one used with ssh -i), pasted as is
#   DEPLOY_DOMAIN    cidms.duckdns.org (for the check after deploying)
# The server keeps its own /opt/supreme-dms/.env.production; it is never in git or in GitHub.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supreme
          POSTGRES_USER: supreme_owner
          POSTGRES_PASSWORD: local-owner-only   # a throwaway database that exists only for this run
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supreme_owner -d supreme" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Database roles (as the Docker image does on first start)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGPASSWORD: local-owner-only
          POSTGRES_USER: supreme_owner
          POSTGRES_DB: supreme
          APP_DB_PASSWORD: local-app-only
        run: sh docker/postgres/01-roles.sh
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: python -m pytest -p no:warnings -q --ignore=tests/test_browser.py

  web:
    name: Screens (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm run build

  deploy:
    name: Deploy to the server
    needs: [server, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production   # one deploy at a time, never cancelled half-way
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy.key && chmod 600 ~/.ssh/deploy.key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Upload the app
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar -czf /tmp/supreme-dms.tgz --exclude=./.git --exclude=./web/node_modules --exclude=./web/dist .
          scp -i ~/.ssh/deploy.key /tmp/supreme-dms.tgz "$USER@$HOST:/tmp/supreme-dms.tgz"
      - name: Build and restart (migrations run first; data and .env.production stay as they are)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy.key "$USER@$HOST" '
            set -e
            cd /opt/supreme-dms
            test -f .env.production || { echo "no .env.production on the server"; exit 1; }
            tar -xzf /tmp/supreme-dms.tgz && rm /tmp/supreme-dms.tgz && chmod +x deploy/*.sh
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans
            sudo docker image prune -f > /dev/null
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file .env.production ps'
      - name: Check it answers over HTTPS
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://admin.$DOMAIN/readyz"; then echo; echo "live"; exit 0; fi
            sleep 6
          done
          echo "the app didn't answer after deploying"; exit 1
