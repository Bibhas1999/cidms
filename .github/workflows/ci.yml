# CI/CD for CIDMS.
#   Only for main: the release pull request (dev -> main) and every push to main run lint, the server tests
#   (against a real Postgres), the screens' type-check and build. Feature -> dev pull requests run nothing.
#   A push to main that passes: deploys to the Oracle server (same steps as deploy/deploy.ps1, without moving data).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST      the server's IP, e.g. 137.23.42.178
#   DEPLOY_USER      opc
#   DEPLOY_SSH_KEY   the whole private key file (the one used with ssh -i), pasted as is
#   DEPLOY_DOMAIN    cidms.duckdns.org (for the check after deploying)
#   DEPLOY_HOST_KEY  the server's SSH host key line(s), so CI only talks to the real server. Get it once from a
#                    machine you trust: ssh-keyscan -t ed25519 <host>   (without it CI falls back to ssh-keyscan
#                    and warns, which trusts whatever answers)
#
# Every deploy builds the image on the server tagged with the commit (supreme-dms:<sha>), keeps the last five,
# and records it in /opt/supreme-dms/releases.log. deploy/rollback.sh goes back to the previous one.
# The server keeps its own /opt/supreme-dms/.env.production; it is never in git or in GitHub.
name: CI/CD

# Paused (owner's request, 18 Oct 2026): runs only when started by hand (Actions > CI/CD > Run workflow, on main),
# which tests and then deploys. To run on every push to main again, put back:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: supreme
          POSTGRES_USER: supreme_owner
          POSTGRES_PASSWORD: local-owner-only   # a throwaway database that exists only for this run
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supreme_owner -d supreme" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Database roles (as the Docker image does on first start)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGPASSWORD: local-owner-only
          POSTGRES_USER: supreme_owner
          POSTGRES_DB: supreme
          APP_DB_PASSWORD: local-app-only
        run: sh docker/postgres/01-roles.sh
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: python -m pytest -p no:warnings -q --ignore=tests/test_browser.py
      - name: Known vulnerabilities in the Python packages
        run: pip install pip-audit && pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off

  browser:
    name: Browser checks (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: supreme
          POSTGRES_USER: supreme_owner
          POSTGRES_PASSWORD: local-owner-only
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U supreme_owner -d supreme" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: web
      - name: Database roles
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGPASSWORD: local-owner-only
          POSTGRES_USER: supreme_owner
          POSTGRES_DB: supreme
          APP_DB_PASSWORD: local-app-only
        run: sh docker/postgres/01-roles.sh
      - name: Browser tests
        env:
          BROWSER_CHANNEL: chromium
        run: python -m pytest -p no:warnings -q tests/test_browser.py

  web:
    name: Screens (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm run build
      - name: Known vulnerabilities in the packages the app ships
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to the server
    needs: [server, web, browser]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production   # one deploy at a time, never cancelled half-way
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key (and the server's own key, pinned)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy.key && chmod 600 ~/.ssh/deploy.key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY isn't set: trusting whatever key the server shows (ssh-keyscan). Add the secret."
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Upload the app
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Only what git tracks: never a stray local file (a database dump, uploaded files, .env).
          git archive --format=tar.gz -o /tmp/supreme-dms.tgz HEAD
          scp -i ~/.ssh/deploy.key /tmp/supreme-dms.tgz "$USER@$HOST:/tmp/supreme-dms.tgz"
      - name: Build and restart (migrations run first; data and .env.production stay as they are)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy.key "$USER@$HOST" "export APP_VERSION=${VERSION::12};"'
            set -e
            cd /opt/supreme-dms
            test -f .env.production || { echo "no .env.production on the server"; exit 1; }
            # The code folders are replaced, not unpacked over: files deleted from the code do not linger here
            # (they would be built into the app again). .env.production and backups/ are left alone.
            # No apostrophes anywhere in this block: it is one single-quoted ssh command.
            rm -rf app migrations web deploy docker tests
            tar -xzf /tmp/supreme-dms.tgz && rm /tmp/supreme-dms.tgz && chmod +x deploy/*.sh
            sudo --preserve-env=APP_VERSION docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans
            sudo --preserve-env=APP_VERSION docker compose -f deploy/docker-compose.prod.yml --env-file .env.production exec -T app python -m app.seed --roles-only
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $APP_VERSION" | sudo tee -a releases.log > /dev/null
            # Keep the last five versions for deploy/rollback.sh; remove older ones.
            sudo docker image ls supreme-dms --format "{{.Tag}}" | grep -v -x -e latest -e "$APP_VERSION" | tail -n +5 | sed "s/^/supreme-dms:/" | xargs -r sudo docker image rm > /dev/null || true
            sed "s/@USER@/$(whoami)/" deploy/backup.cron | sudo tee /etc/cron.d/supreme-dms-backup > /dev/null
            sudo chmod 644 /etc/cron.d/supreme-dms-backup
            sudo docker image prune -f > /dev/null
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file .env.production ps'
      - name: Check it answers over HTTPS
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://admin.$DOMAIN/readyz"; then echo; echo "live"; exit 0; fi
            sleep 6
          done
          echo "the app didn't answer after deploying"; exit 1
