# CIDMS on one server (Oracle Cloud Always Free, ARM): the database, the app, the background worker and
# Caddy (HTTPS) in front. Run from /opt/supreme-dms with the production settings in .env.production:
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The database has no public port at all.
# Images are pinned by digest (the tag says what it is; the digest makes it exactly that build). To update one:
#   docker buildx imagetools inspect caddy:2-alpine   (copy the Digest line)
name: supreme-dms

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: supreme
      POSTGRES_USER: supreme_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env.production}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env.production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supreme_owner -d supreme"]
      interval: 5s
      retries: 20
    shm_size: 256mb
    restart: unless-stopped

  # Brings the tables up to date before the app starts (and exits).
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: supreme-dms:${APP_VERSION:-latest}   # the commit being deployed (CI sets APP_VERSION)
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [../.env.production]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    image: supreme-dms:${APP_VERSION:-latest}   # the commit being deployed (CI sets APP_VERSION)
    env_file: [../.env.production]
    # Behind Caddy on the private Docker network: trust its X-Forwarded-* headers.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      BACKUP_DIR: /srv/backups
    volumes:
      - app-storage:/srv/storage
      - ../backups:/srv/backups:ro   # deploy/backup.sh's copies, for downloads in Settings > Backups
    restart: unless-stopped

  worker:
    image: supreme-dms:${APP_VERSION:-latest}   # the commit being deployed (CI sets APP_VERSION)
    env_file: [../.env.production]
    command: ["python", "-m", "app.worker", "--concurrency", "2"]
    volumes:
      - app-storage:/srv/storage   # each centre's backups (written here, downloaded through the app)
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_signal: SIGTERM
    stop_grace_period: 60s   # lets the job in hand finish
    # The image's health check calls the web port, which the worker doesn't have. The worker touches
    # WORKER_ALIVE_FILE every 30 s from its main loop: unhealthy when that stops for 2 minutes (stuck, not just alive).
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/cidms-worker-alive') < 120 else 1)"]
      interval: 60s
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  pg-data:
  app-storage:
  caddy-data:
  caddy-config:
