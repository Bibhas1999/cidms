# CIDMS on one server (Oracle Cloud Always Free, ARM): the database, the app, the background worker and
# Caddy (HTTPS) in front. Run from /opt/supreme-dms with the production settings in .env.production:
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The database has no public port at all.
name: supreme-dms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supreme
      POSTGRES_USER: supreme_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env.production}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env.production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supreme_owner -d supreme"]
      interval: 5s
      retries: 20
    shm_size: 256mb
    restart: unless-stopped

  # Brings the tables up to date before the app starts (and exits).
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: supreme-dms:latest
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [../.env.production]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    image: supreme-dms:latest
    env_file: [../.env.production]
    # Behind Caddy on the private Docker network: trust its X-Forwarded-* headers.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      BACKUP_DIR: /srv/backups
    volumes:
      - app-storage:/srv/storage
      - ../backups:/srv/backups:ro   # deploy/backup.sh's copies, for downloads in Settings > Backups
    restart: unless-stopped

  worker:
    image: supreme-dms:latest
    env_file: [../.env.production]
    command: ["python", "-m", "app.worker", "--concurrency", "2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_signal: SIGTERM
    stop_grace_period: 60s   # lets the job in hand finish
    # The image's health check calls the web port, which the worker doesn't have: check that the process is alive.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1') else 1)"]
      interval: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  pg-data:
  app-storage:
  caddy-data:
  caddy-config:
