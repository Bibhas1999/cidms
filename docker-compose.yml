# Local development: the Supreme DMS database.
#
#   docker compose up -d
#   python -m alembic upgrade head
#   python -m app.seed
#
# Passwords below are for these throwaway local containers only.
services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: supreme
      POSTGRES_USER: supreme_owner        # owns the tables and runs migrations
      POSTGRES_PASSWORD: local-owner-only
      APP_DB_PASSWORD: local-app-only     # for supreme_app, the role the app connects as (see docker/postgres)
    ports: ["5433:5432"]
    volumes:
      - supreme-pg:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supreme_owner -d supreme"]
      interval: 5s
      retries: 10

  # The old Laravel app's database, loaded from pos.sql exactly as exported, only for moving the data across.
  # Started only when asked:  docker compose --profile legacy up -d legacy
  legacy:
    image: mariadb:10.4
    profiles: ["legacy"]
    environment:
      MYSQL_DATABASE: pos
      MYSQL_ROOT_PASSWORD: local-legacy-only
    ports: ["3307:3306"]
    volumes: ["supreme-legacy:/var/lib/mysql"]

  # Medical images (phase 4). Orthanc keeps the DICOM studies; only the app talks to its web port (127.0.0.1),
  # with the user and password below (set ORTHANC_USER / ORTHANC_PASSWORD in .env, the same values the app uses).
  # Scanners send studies to its DICOM port 4242 (AE title SUPREME).
  orthanc:
    image: orthancteam/orthanc:latest@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    environment:
      ORTHANC__NAME: "Supreme DMS images"
      ORTHANC__DICOM_AET: SUPREME
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER:-supreme}": "${ORTHANC_PASSWORD:-local-orthanc-only}"}'
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__STUDIES_METADATA: "MainDicomTags"
      ORTHANC__DICOM_WEB__SERIES_METADATA: "Full"
      ORTHANC__OVERWRITE_INSTANCES: "false"
      VERBOSE_STARTUP: "false"
    ports:
      - "127.0.0.1:8042:8042"   # REST + DICOMweb: this machine only (the app)
      - "4242:4242"             # DICOM: for the scanners on the centre's network
    volumes:
      - supreme-orthanc:/var/lib/orthanc/db
    restart: unless-stopped

  # The OHIF image viewer. Browsers reach it only through the app at /viewer (same address, same sign-in);
  # its data source is the app's DICOMweb proxy at /api/dicom-web (docker/ohif/app-config.js).
  ohif:
    image: ohif/app:latest@sha256:d9c875439ee682efb751c004ee9124405861633a5e7dd654f792e55a2dcce895
    environment:
      PORT: "80"
    ports:
      - "127.0.0.1:3005:80"
    volumes:
      - ./docker/ohif/app-config.js:/config/app-config.js:ro
    entrypoint: ["/bin/sh", "-c", "cp /config/app-config.js /usr/share/nginx/html/app-config.js && exec /usr/src/entrypoint.sh nginx -g 'daemon off;'"]
    restart: unless-stopped

  # Background jobs (daily summaries, dues digests, exports, notifications, cleanup): python -m app.worker.
  # Started only when asked:  docker compose --profile worker up -d worker   (or run it directly, see app/worker.py)
  # Scale out with --scale worker=3: workers share the queue safely.
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "app.worker", "--concurrency", "2"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://supreme_app:local-app-only@postgres:5432/supreme
    depends_on:
      postgres: { condition: service_healthy }
    stop_signal: SIGTERM
    stop_grace_period: 60s   # lets the job in hand finish
    restart: unless-stopped

volumes:
  supreme-pg:
  supreme-legacy:
  supreme-orthanc:
